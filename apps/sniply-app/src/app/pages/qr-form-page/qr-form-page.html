<section class="d-grid gap-3">
  <h1 class="h3 mb-0">Create QR Code</h1>
  <article class="card border-0 shadow-sm">
    <div class="card-body">
      @if (errorMessage) {
        <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
      }
      @if (prefillQrPayload$ | async; as prefill) {
        <app-qr-form
          [prefillTargetUrl]="prefill.targetUrl"
          [prefillLabel]="prefill.label ?? ''"
          [prefillForegroundColor]="prefill.foregroundColor ?? '#0f172a'"
          [isSubmitting]="isSubmitting"
          (formSubmit)="createQrCode($event)"
        ></app-qr-form>
      }
    </div>
  </article>
</section>
