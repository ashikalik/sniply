@if (visible) {
  <div class="popup-backdrop" (click)="onCancel()">
    <div class="popup-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <h2 class="h5 mb-2">{{ title }}</h2>
      <p class="text-secondary mb-4">{{ message }}</p>
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="onCancel()" [disabled]="loading">
          {{ cancelText }}
        </button>
        <button class="btn btn-danger btn-sm" type="button" (click)="onConfirm()" [disabled]="loading">
          @if (loading) {
            Deleting...
          } @else {
            {{ confirmText }}
          }
        </button>
      </div>
    </div>
  </div>
}
