<div class="p-3 h-100">
  <nav class="list-group list-group-flush" aria-label="Dashboard navigation">
    @for (item of links; track item.path) {
      <a
        [routerLink]="item.path"
        class="list-group-item list-group-item-action border-0 rounded mb-1 d-flex align-items-center gap-2"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
      >
        <i [class]="'bi ' + item.icon + ' me-1'"></i>
        {{ item.label }}
      </a>
    }
  </nav>
</div>
