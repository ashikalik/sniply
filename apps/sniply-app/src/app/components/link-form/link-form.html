<form class="row g-3" [formGroup]="form" (ngSubmit)="submit()">
  <div class="col-12">
    <label class="form-label" for="home-link-destination">Enter your destination URL</label>
    <div class="input-group">
      <input
        id="home-link-destination"
        class="form-control"
        type="url"
        placeholder="https://example.com/your-link"
        formControlName="destinationUrl"
      />
      <button class="btn btn-primary" type="submit">Create link</button>
    </div>
    @if (form.controls.destinationUrl.touched && form.controls.destinationUrl.invalid) {
      <small class="text-danger">Destination URL is required.</small>
    }
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label" for="home-link-slug">Custom slug</label>
    <input
      id="home-link-slug"
      class="form-control"
      type="text"
      placeholder="spring-offer"
      formControlName="slug"
    />
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label" for="home-link-campaign">Campaign</label>
    <input
      id="home-link-campaign"
      class="form-control"
      type="text"
      placeholder="q1-launch"
      formControlName="campaign"
    />
  </div>
</form>
