<header class="navbar navbar-expand-lg bg-white border-bottom px-3 px-lg-4 py-2">
  <div class="container-fluid p-0 gap-2">
    <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="#">
      <span class="brand-mark fw-bold">S</span>
      <span class="fw-semibold text-body">Sniply App</span>
    </a>

    <form class="d-none d-md-flex ms-auto me-2 search-form" role="search">
      <input
        class="form-control form-control-sm"
        type="search"
        placeholder="Search..."
        aria-label="Search"
      />
    </form>

    <div class="d-flex align-items-center gap-2">
      @if (user$ | async; as user) {
        <div class="dropdown">
          <button
            class="btn p-0 border-0 bg-transparent"
            type="button"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
            [title]="user.email"
          >
            <span class="badge rounded-pill text-bg-light border user-chip">
              {{ getInitial(user.email) }}
            </span>
          </button>
          <div class="dropdown-menu dropdown-menu-end shadow-sm profile-popover">
            <div class="px-3 py-2 border-bottom">
              <div class="fw-semibold text-dark text-truncate">{{ user.email }}</div>
              <div class="small text-muted">ID: {{ getShortId(user.id) }}</div>
            </div>
            <div class="px-3 py-2 small">
              <div class="d-flex justify-content-between">
                <span class="text-muted">Status</span>
                <span class="text-capitalize">{{ user.status ?? 'active' }}</span>
              </div>
              <div class="d-flex justify-content-between mt-1">
                <span class="text-muted">Verified</span>
                <span>{{ user.emailVerifiedAt ? 'Yes' : 'No' }}</span>
              </div>
            </div>
            <div class="border-top p-2">
              <button class="btn btn-outline-danger btn-sm w-100" type="button" (click)="logout()" [disabled]="isLoggingOut">
                @if (isLoggingOut) {
                  Logging out...
                } @else {
                  Logout
                }
              </button>
            </div>
          </div>
        </div>
      } @else {
        <a class="btn btn-outline-primary btn-sm px-3" routerLink="/login">Login</a>
      }
    </div>
  </div>
</header>
