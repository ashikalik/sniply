<nav class="navbar navbar-expand-lg navbar-light sniply-header">
  <div class="container">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" routerLink="/">
      <span class="brand-dot"></span>
      Sniply
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sniplyNavbar"
      aria-controls="sniplyNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="sniplyNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/features" routerLinkActive="active">Features</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/resources" routerLinkActive="active">Resources</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/pricing" routerLinkActive="active">Pricing</a>
        </li>
      </ul>

      @if (user$ | async; as user) {
        <div class="dropdown">
          <button
            class="btn p-0 border-0 bg-transparent"
            type="button"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
            [title]="user.email"
          >
            <span class="profile-icon">{{ getInitial(user.email) }}</span>
          </button>
          <div class="dropdown-menu dropdown-menu-end shadow-sm profile-popover">
            <div class="px-3 py-2 border-bottom">
              <div class="fw-semibold text-dark text-truncate">{{ user.email }}</div>
              <div class="small text-muted">ID: {{ getShortId(user.id) }}</div>
            </div>
            <div class="px-3 py-2 small">
              <div class="d-flex justify-content-between">
                <span class="text-muted">Status</span>
                <span class="text-capitalize">{{ user.status ?? 'active' }}</span>
              </div>
              <div class="d-flex justify-content-between mt-1">
                <span class="text-muted">Verified</span>
                <span>{{ user.emailVerifiedAt ? 'Yes' : 'No' }}</span>
              </div>
            </div>
            <div class="border-top p-2">
              <button class="btn btn-outline-danger btn-sm w-100" type="button" (click)="logout()" [disabled]="isLoggingOut">
                @if (isLoggingOut) {
                  Logging out...
                } @else {
                  Logout
                }
              </button>
            </div>
          </div>
        </div>
      } @else {
        <div class="d-flex gap-2 align-items-center">
          <a class="btn btn-link text-decoration-none text-body" routerLink="/login">Sign in</a>
          <button class="btn sniply-btn-secondary" type="button">Talk to sales</button>
          <a class="btn sniply-btn-primary" routerLink="/register">Get started</a>
        </div>
      }
    </div>
  </div>
</nav>
