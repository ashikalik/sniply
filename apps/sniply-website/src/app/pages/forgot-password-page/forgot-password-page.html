<main class="forgot-password-page">
  <div class="container">
    <div class="forgot-password-shell">
      <h1 class="h3 mb-2">Forgot your password?</h1>
      <p class="text-muted mb-4">
        Enter your account email and we will send a password reset link.
      </p>

      <form class="d-grid gap-3">
        <div>
          <label class="form-label" for="forgotEmailWebsite">Email address</label>
          <input
            id="forgotEmailWebsite"
            class="form-control"
            type="email"
            placeholder="you@company.com"
          />
        </div>
        <button class="btn btn-primary" type="button">Send reset link</button>
      </form>

      <p class="text-muted mt-4 mb-0">
        Remembered your password?
        <a href="/login" routerLink="/login" class="text-decoration-none">Sign in</a>
      </p>
    </div>
  </div>
</main>
