name: Hostinger k3s Deploy

on:
  push:
    branches:
      - main
      - deploy/mithun
  workflow_dispatch:

concurrency:
  group: hostinger-k3s-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TARGET_NAMESPACE: sniply-staging

jobs:
  # Nx affected deployment is intentionally disabled for now.
  # To re-enable in future:
  # 1) Add a detect job that sets output `apps`.
  # 2) Switch matrix to: app: ${{ fromJson(needs.detect-affected.outputs.apps) }}
  # Example detect command:
  #   npx nx show projects --affected --type app --base="$BASE_SHA" --head="$HEAD_SHA" --json
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    strategy:
      fail-fast: false
      matrix:
        app:
          - sniply-server
          - sniply-auth
          - sniply-website
          - sniply-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_SHA="$REGISTRY_HOST/$REGISTRY_OWNER/$APP:$IMAGE_TAG"
          IMAGE_LATEST="$REGISTRY_HOST/$REGISTRY_OWNER/$APP:latest"

          docker build -f "Dockerfile.$APP" -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Apply manifests
        env:
          APP: ${{ matrix.app }}
          TARGET_NAMESPACE: ${{ env.TARGET_NAMESPACE }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          cat "k8s/base/$APP/deployment.yaml" | ssh "$VPS_USER@$VPS_HOST" "kubectl apply -f -"
          cat "k8s/base/$APP/service.yaml" | ssh "$VPS_USER@$VPS_HOST" "kubectl apply -f -"
          cat k8s/ingress.yaml | ssh "$VPS_USER@$VPS_HOST" "kubectl apply -f -"

      - name: Update image and rollout
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
          IMAGE_TAG: ${{ github.sha }}
          TARGET_NAMESPACE: ${{ env.TARGET_NAMESPACE }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          IMAGE_SHA="$REGISTRY_HOST/$REGISTRY_OWNER/$APP:$IMAGE_TAG"
          ssh "$VPS_USER@$VPS_HOST" "kubectl set image deployment/$APP $APP=$IMAGE_SHA -n $TARGET_NAMESPACE"
          ssh "$VPS_USER@$VPS_HOST" "kubectl rollout status deployment/$APP -n $TARGET_NAMESPACE --timeout=180s"
