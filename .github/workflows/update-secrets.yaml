name: Update Kubernetes Secrets

on:
  workflow_dispatch:

concurrency:
  group: hostinger-k3s-staging-secrets
  cancel-in-progress: false

env:
  TARGET_NAMESPACE: sniply-staging

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    environment: staging

    strategy:
      fail-fast: false
      matrix:
        app:
          - sniply-server
          - sniply-auth
          - sniply-website
          - sniply-app

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Create app env secret and attach to deployment
        env:
          APP: ${{ matrix.app }}
          TARGET_NAMESPACE: ${{ env.TARGET_NAMESPACE }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ENV_SNIPLY_SERVER_VAR: ${{ vars.ENV_SNIPLY_SERVER }}
          ENV_SNIPLY_AUTH_VAR: ${{ vars.ENV_SNIPLY_AUTH }}
          ENV_SNIPLY_WEBSITE_VAR: ${{ vars.ENV_SNIPLY_WEBSITE }}
          ENV_SNIPLY_APP_VAR: ${{ vars.ENV_SNIPLY_APP }}
        run: |
          APP_ENV_BLOB=""
          case "$APP" in
            sniply-server)
              APP_ENV_BLOB="$ENV_SNIPLY_SERVER_VAR"
              ;;
            sniply-auth)
              APP_ENV_BLOB="$ENV_SNIPLY_AUTH_VAR"
              ;;
            sniply-website)
              APP_ENV_BLOB="$ENV_SNIPLY_WEBSITE_VAR"
              ;;
            sniply-app)
              APP_ENV_BLOB="$ENV_SNIPLY_APP_VAR"
              ;;
            *)
              echo "No env mapping configured for app: $APP"
              exit 1
              ;;
          esac

          if [[ -z "$APP_ENV_BLOB" ]]; then
            echo "Missing staging env blob for $APP. Set ENV_SNIPLY_SERVER / ENV_SNIPLY_AUTH / ENV_SNIPLY_WEBSITE / ENV_SNIPLY_APP as GitHub Environment Variables in 'staging'."
            exit 1
          fi

          if printf '%s' "$APP_ENV_BLOB" | base64 -d >/tmp/app-env.txt 2>/dev/null; then
            APP_ENV_TEXT=$(cat /tmp/app-env.txt)
          else
            APP_ENV_TEXT="$APP_ENV_BLOB"
          fi

          SECRET_NAME="$APP-env"
          printf '%s\n' "$APP_ENV_TEXT" | ssh "$VPS_USER@$VPS_HOST" "kubectl create secret generic $SECRET_NAME --from-env-file=/dev/stdin -n $TARGET_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -"
          ssh "$VPS_USER@$VPS_HOST" "kubectl set env deployment/$APP --from=secret/$SECRET_NAME -n $TARGET_NAMESPACE"
          ssh "$VPS_USER@$VPS_HOST" "kubectl rollout restart deployment/$APP -n $TARGET_NAMESPACE"
          ssh "$VPS_USER@$VPS_HOST" "kubectl rollout status deployment/$APP -n $TARGET_NAMESPACE --timeout=180s"
